<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindSpace - Student Support</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.9/dist/purify.min.js"></script>

    <style>
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }

        .message-enter {
            animation: fadeUp 0.3s ease-out forwards;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .prose ul {
            list-style-type: disc;
            padding-left: 1.2em;
            margin: 0.5em 0;
        }

        .prose ol {
            list-style-type: decimal;
            padding-left: 1.2em;
            margin: 0.5em 0;
        }

        .prose strong {
            font-weight: 700;
        }

        .prose em {
            font-style: italic;
        }

        .prose p {
            margin-bottom: 0.5em;
        }

        .prose p:last-child {
            margin-bottom: 0;
        }

        .prose h1,
        .prose h2,
        .prose h3 {
            font-weight: bold;
            margin-top: 0.8em;
            margin-bottom: 0.2em;
        }

        .prose a {
            color: #0d9488;
            font-weight: 600;
            text-decoration: underline;
            transition: color 0.2s;
        }

        .prose a:hover {
            color: #0f766e;
        }
    </style>
</head>

<body class="bg-slate-50 h-screen flex flex-col font-sans text-slate-800">

    <header class="bg-white shadow-sm p-4 flex items-center justify-between z-10">
        <div class="flex items-center gap-3">
            <div class="bg-teal-100 p-2 rounded-full">
                <i class="fa-solid fa-leaf text-teal-600 text-xl"></i>
            </div>
            <div>
                <h1 class="font-bold text-xl text-slate-800">MindSpace</h1>
                <p class="text-xs text-slate-500">AI Student Support • Confidential</p>
            </div>
        </div>
        <button onclick="clearChat()" class="text-sm text-slate-400 hover:text-red-500 transition">
            <i class="fa-solid fa-trash-can mr-1"></i> Clear Chat
        </button>
    </header>

    <main id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-4 scrollbar-hide">
        <div class="flex justify-start message-enter">
            <div
                class="bg-white border border-slate-100 rounded-2xl rounded-tl-none p-4 shadow-sm max-w-[85%] md:max-w-[70%]">
                <p class="text-sm leading-relaxed">
                    Hello! I'm your AI support companion. I'm here to listen without judgment.
                    How are you feeling today?
                </p>
            </div>
        </div>
    </main>

    <footer class="bg-white p-4 border-t border-slate-100">
        <div class="max-w-4xl mx-auto relative flex items-center gap-2">
            <input type="text" id="user-input"
                class="w-full bg-slate-100 rounded-full pl-6 pr-12 py-4 focus:outline-none focus:ring-2 focus:ring-teal-500 transition shadow-inner text-sm"
                placeholder="Type how you feel..." onkeypress="handleKeyPress(event)">

            <button onclick="sendMessage()"
                class="absolute right-2 bg-teal-600 hover:bg-teal-700 text-white p-3 rounded-full shadow-md transition transform hover:scale-105">
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </div>
        <p class="text-center text-[10px] text-slate-400 mt-2">
            AI generated responses. For immediate crisis, please call the Helpline: 555-0199.
        </p>
    </footer>

    <script>
        let historyIds = [];
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');

        function handleKeyPress(event) { if (event.key === 'Enter') sendMessage(); }

        function addMessage(text, isUser) {
            const div = document.createElement('div');
            div.className = `flex ${isUser ? 'justify-end' : 'justify-start'} message-enter`;

            const bubble = document.createElement('div');
            bubble.className = isUser
                ? 'bg-teal-600 text-white rounded-2xl rounded-tr-none p-4 shadow-md max-w-[85%] md:max-w-[70%] text-sm'
                : 'bg-white border border-slate-100 rounded-2xl rounded-tl-none p-4 shadow-sm max-w-[85%] md:max-w-[70%] text-sm leading-relaxed';

            if (isUser) {
                bubble.textContent = text;
            } else {
                const rawHtml = marked.parse(text);
                bubble.innerHTML = DOMPurify.sanitize(rawHtml);
                bubble.classList.add('prose');
            }

            div.appendChild(bubble);
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function showLoading() {
            const div = document.createElement('div');
            div.id = 'loading-indicator';
            div.className = 'flex justify-start message-enter';
            div.innerHTML = `
                <div class="bg-white border border-slate-100 rounded-2xl rounded-tl-none p-4 shadow-sm">
                    <div class="flex gap-1">
                        <div class="w-2 h-2 bg-slate-400 rounded-full animate-bounce"></div>
                        <div class="w-2 h-2 bg-slate-400 rounded-full animate-bounce" style="animation-delay: 0.1s"></div>
                        <div class="w-2 h-2 bg-slate-400 rounded-full animate-bounce" style="animation-delay: 0.2s"></div>
                    </div>
                </div>`;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function removeLoading() {
            const loader = document.getElementById('loading-indicator');
            if (loader) loader.remove();
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;
            addMessage(text, true);
            userInput.value = '';
            showLoading();

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text, history_ids: historyIds })
                });
                const data = await response.json();
                removeLoading();

                if (data.status === "OK") {
                    addMessage(data.response, false);
                    historyIds = data.history_ids;
                } else if (data.status === "CRISIS_ALERT") {
                    const div = document.createElement('div');
                    div.className = 'flex justify-start message-enter';
                    div.innerHTML = `
                        <div class="bg-red-50 border border-red-200 text-red-800 rounded-2xl p-4 shadow-sm max-w-[85%]">
                            <p class="font-bold text-sm mb-1"><i class="fa-solid fa-triangle-exclamation"></i> Crisis Alert</p>
                            <p class="text-sm">${data.response}</p>
                        </div>`;
                    chatContainer.appendChild(div);
                    historyIds = [];
                } else {
                    addMessage("I'm having trouble connecting. Please try again.", false);
                }
            } catch (error) {
                removeLoading();
                addMessage("Error connecting to server.", false);
                console.error(error);
            }
        }

        function clearChat() {
            if (confirm("Start a new conversation?")) {
                location.reload();
            }
        }
    </script>
</body>

</html>
