<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen p-6">
    <div class="max-w-6xl mx-auto">
        <div class="flex items-center justify-between mb-6">
            <h1 class="text-2xl font-bold text-slate-800">Admin Dashboard</h1>
            <button onclick="logout()" class="text-sm text-red-600 hover:underline">Logout</button>
        </div>
        <p id="session-text" class="text-sm text-slate-600 mb-4"></p>

        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                <p class="text-xs text-slate-500 uppercase font-bold tracking-wider">Students</p>
                <p id="stat-students" class="text-3xl font-black text-slate-800 mt-1">-</p>
            </div>
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                <p class="text-xs text-slate-500 uppercase font-bold tracking-wider">Appointments</p>
                <p id="stat-appoints" class="text-3xl font-black text-slate-800 mt-1">-</p>
            </div>
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                <p class="text-xs text-slate-500 uppercase font-bold tracking-wider">Psychologists</p>
                <p id="stat-psychs" class="text-3xl font-black text-slate-800 mt-1">-</p>
            </div>
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                <p class="text-xs text-teal-600 uppercase font-bold tracking-wider">Avg PHQ-9</p>
                <p id="stat-phq9" class="text-3xl font-black text-teal-700 mt-1">-</p>
            </div>
        </div>

        <div class="grid md:grid-cols-2 gap-6">
            <section class="bg-white rounded-xl border border-slate-200 p-4">
                <h2 class="font-semibold mb-3">Add Psychologist</h2>
                <div class="space-y-2">
                    <input id="email" type="email" placeholder="Email" class="w-full bg-slate-100 rounded p-2 text-sm">
                    <input id="name" type="text" placeholder="Name" class="w-full bg-slate-100 rounded p-2 text-sm">
                    <input id="specialization" type="text" placeholder="Specialization" class="w-full bg-slate-100 rounded p-2 text-sm">
                    <input id="password" type="password" placeholder="Temporary Password" class="w-full bg-slate-100 rounded p-2 text-sm">
                    <button onclick="addPsychologist()" class="px-4 py-2 bg-teal-600 text-white rounded text-sm">Create</button>
                </div>
                <p id="create-message" class="text-sm mt-2"></p>
            </section>
            <section class="bg-white rounded-xl border border-slate-200 p-4">
                <h2 class="font-semibold mb-3">Psychologists</h2>
                <div id="psych-list" class="space-y-2 text-sm"></div>
            </section>
        </div>

        <section class="bg-white rounded-xl border border-slate-200 p-4 mt-6">
            <h2 class="font-semibold mb-3">All Appointments</h2>
            <div id="appointment-list" class="space-y-2 text-sm"></div>
        </section>

        <section class="bg-white rounded-xl border border-slate-200 p-4 mt-6">
            <h2 class="font-semibold mb-3">Add Psychoeducational Resource</h2>
            <div class="grid md:grid-cols-5 gap-3">
                <input id="res-title" type="text" placeholder="Resource Title" class="col-span-2 bg-slate-50 border border-slate-200 rounded p-2 text-sm">
                <select id="res-type" class="bg-slate-50 border border-slate-200 rounded p-2 text-sm">
                    <option value="video">Video</option>
                    <option value="audio">Audio</option>
                    <option value="guide">Guide</option>
                </select>
                <input id="res-url" type="url" placeholder="URL (e.g. YouTube Embed Link)" class="col-span-2 bg-slate-50 border border-slate-200 rounded p-2 text-sm">
            </div>
            <textarea id="res-desc" placeholder="Description (Optional)" class="w-full mt-3 bg-slate-50 border border-slate-200 rounded p-2 text-sm" rows="2"></textarea>
            <button onclick="addResource(event)" class="mt-3 px-4 py-2 bg-teal-600 hover:bg-teal-700 text-white rounded text-sm shadow-sm transition-colors">Add Resource</button>
            <p id="res-message" class="text-sm mt-2"></p>
        </section>
    </div>

    <script>
        async function requireAdminSession() {
            const response = await fetch('/api/session');
            if (!response.ok) {
                window.location.href = '/admin/login';
                return null;
            }
            const data = await response.json();
            if (data.user.role !== 'admin') {
                window.location.href = '/admin/login';
                return null;
            }
            document.getElementById('session-text').textContent = `Logged in as ${data.user.name} (${data.user.subject})`;
            return data.user;
        }

        async function addPsychologist() {
            const payload = {
                email: document.getElementById('email').value.trim(),
                name: document.getElementById('name').value.trim(),
                specialization: document.getElementById('specialization').value.trim(),
                password: document.getElementById('password').value.trim()
            };
            const message = document.getElementById('create-message');
            message.className = 'text-sm mt-2';
            const response = await fetch('/api/admin/psychologists', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await response.json();
            if (response.ok) {
                message.classList.add('text-green-700');
                message.textContent = 'Psychologist added.';
                await loadPsychologists();
            } else {
                message.classList.add('text-red-600');
                message.textContent = data.detail || data.message || 'Could not add psychologist.';
            }
        }

        async function loadPsychologists() {
            const list = document.getElementById('psych-list');
            list.innerHTML = 'Loading...';
            const response = await fetch('/api/admin/psychologists');
            const data = await response.json();
            if (!response.ok || data.status !== 'OK') {
                list.textContent = 'Could not load psychologists.';
                return;
            }
            list.innerHTML = '';
            data.psychologists.forEach(item => {
                const row = document.createElement('div');
                row.className = 'border border-slate-200 rounded p-3';
                row.innerHTML = `<p class="font-medium">${item.name}</p><p class="text-slate-600">${item.email} • ${item.specialization}</p>`;
                list.appendChild(row);
            });
        }

        async function loadAppointments() {
            const list = document.getElementById('appointment-list');
            list.innerHTML = 'Loading...';
            const response = await fetch('/api/admin/appointments');
            const data = await response.json();
            if (!response.ok || data.status !== 'OK') {
                list.textContent = 'Could not load appointments.';
                return;
            }
            if (data.appointments.length === 0) {
                list.textContent = 'No appointments booked yet.';
                return;
            }
            list.innerHTML = '';
            data.appointments.forEach(item => {
                const row = document.createElement('div');
                row.className = 'border border-slate-200 rounded p-3';
                row.innerHTML = `
                    <p class="font-medium">${item.student_id} with ${item.psychologist_name}</p>
                    <p class="text-slate-600">${new Date(item.start_at).toLocaleString()} - ${new Date(item.end_at).toLocaleString()}</p>
                    <p class="text-xs uppercase">${item.status}</p>
                `;
                list.appendChild(row);
            });
        }

        async function loadAnalytics() {
            const resp = await fetch('/api/admin/analytics');
            if(resp.ok) {
                const data = await resp.json();
                document.getElementById('stat-students').textContent = data.total_students;
                document.getElementById('stat-appoints').textContent = data.total_appointments;
                document.getElementById('stat-psychs').textContent = data.total_psychologists;
                document.getElementById('stat-phq9').textContent = data.average_screening_score || '0';
            }
        }

        async function addResource(event) {
            const btn = event.target;
            const payload = {
                title: document.getElementById('res-title').value.trim(),
                description: document.getElementById('res-desc').value.trim(),
                resource_type: document.getElementById('res-type').value,
                url: document.getElementById('res-url').value.trim()
            };
            
            if (!payload.title || !payload.url) {
                alert("Please provide the resource title and URL.");
                return;
            }

            btn.disabled = true;
            btn.textContent = "Adding...";
            
            const msg = document.getElementById('res-message');
            msg.className = "text-sm mt-2";
            
            const resp = await fetch('/api/admin/resources', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await resp.json();
            if (resp.ok) {
                msg.classList.add('text-green-600');
                msg.textContent = "Resource added successfully. Students can now see it in their Resource Hub.";
                document.getElementById('res-title').value = '';
                document.getElementById('res-desc').value = '';
                document.getElementById('res-url').value = '';
            } else {
                msg.classList.add('text-red-600');
                msg.textContent = data.detail || data.message || "Failed to add resource.";
            }
            btn.disabled = false;
            btn.textContent = "Add Resource";
        }

        async function logout() {
            await fetch('/api/logout', { method: 'POST' });
            window.location.href = '/admin/login';
        }

        (async function init() {
            const session = await requireAdminSession();
            if (!session) return;
            await loadPsychologists();
            await loadAppointments();
            await loadAnalytics();
        })();
    </script>
</body>
</html>
