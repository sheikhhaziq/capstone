<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clinical Session Transcript</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen">
    <div class="max-w-4xl mx-auto p-4 md:p-6 lg:p-8 flex flex-col h-screen">
        <div class="flex items-center justify-between mb-4">
            <div>
                <h1 class="text-2xl font-bold text-slate-800 tracking-tight">Clinical Session Transcript</h1>
                <p id="status" class="text-sm text-slate-500 font-medium"></p>
            </div>
            <a href="javascript:history.back()" class="px-4 py-2 bg-slate-200 text-slate-700 font-medium rounded-lg hover:bg-slate-300 transition">Leave Room</a>
        </div>
        
        <div id="followup-banner" class="hidden mb-4 p-4 border border-teal-200 bg-teal-50 rounded-xl flex flex-col sm:flex-row justify-between items-center shadow-sm">
            <div class="mb-3 sm:mb-0">
                <p class="font-bold text-teal-900">Session Concluded</p>
                <p class="text-sm text-teal-800">You may continue your care by booking another session. Your transcript will carry over automatically.</p>
            </div>
            <a href="/student/dashboard" class="shrink-0 px-4 py-2 bg-teal-600 text-white font-medium rounded-lg hover:bg-teal-700 transition">Book Follow-up</a>
        </div>

        <div id="messages" class="flex-1 bg-white rounded-2xl border border-slate-200 p-6 overflow-y-auto space-y-4 shadow-sm mb-4 flex flex-col">
            <div class="text-center text-slate-400 text-sm mt-auto mb-auto">Loading clinical history...</div>
        </div>

        <div id="input-container" class="flex gap-3 bg-white p-3 rounded-2xl border border-slate-200 shadow-sm transition-opacity">
            <input id="body" type="text" placeholder="Type a message..."
                class="flex-1 bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500 focus:bg-white transition-colors">
            <button id="send-btn" onclick="sendMessage()" class="px-8 py-3 bg-teal-600 font-semibold text-white rounded-xl text-sm hover:bg-teal-700 transition-colors focus:ring-2 focus:ring-teal-500 focus:ring-offset-2">Send</button>
        </div>
    </div>

    <script>
        const appointmentId = Number('{{ appointment_id }}');
        const statusEl = document.getElementById('status');
        const messagesEl = document.getElementById('messages');
        const bodyEl = document.getElementById('body');
        const sendBtn = document.getElementById('send-btn');
        const inputContainer = document.getElementById('input-container');
        const followupBanner = document.getElementById('followup-banner');

        let userRole = null;
        let isSessionActive = true;
        let lastMessageCount = 0;

        function formatTime(iso) {
            return new Date(iso).toLocaleString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
        }

        async function fetchRole() {
            const res = await fetch('/api/session');
            if (res.ok) {
                const data = await res.json();
                userRole = data.user.role;
            }
        }

        function renderMessages(items) {
            if (items.length === lastMessageCount && lastMessageCount !== 0) return;
            lastMessageCount = items.length;

            messagesEl.innerHTML = '';
            if (!items.length) {
                messagesEl.innerHTML = '<div class="text-center text-slate-400 text-sm mt-auto mb-auto bg-slate-50 p-4 rounded-xl shadow-sm border border-slate-200">This is the beginning of the clinical transcript. Context spans across all previous sessions automatically.</div>';
                return;
            }
            
            items.forEach(msg => {
                const isStudent = msg.sender_role === 'student';
                const row = document.createElement('div');
                row.className = `flex flex-col max-w-[80%] ${isStudent ? 'self-end items-end' : 'self-start items-start'}`;
                
                row.innerHTML = `
                    <span class="text-[10px] uppercase font-bold text-slate-400 mb-1 ml-1 mr-1 tracking-wider">${msg.sender_role} • ${formatTime(msg.sent_at)}</span>
                    <div class="px-4 py-3 rounded-2xl text-sm ${isStudent ? 'bg-slate-800 text-white rounded-tr-sm' : 'bg-slate-100 text-slate-800 rounded-tl-sm'} shadow-sm">
                        ${msg.body}
                    </div>
                `;
                messagesEl.appendChild(row);
            });
            setTimeout(() => { messagesEl.scrollTop = messagesEl.scrollHeight; }, 50);
        }

        function lockChat(reason) {
            isSessionActive = false;
            statusEl.textContent = reason;
            statusEl.className = "text-sm font-bold text-rose-600";
            
            bodyEl.disabled = true;
            sendBtn.disabled = true;
            inputContainer.classList.add('opacity-50', 'pointer-events-none');
            
            if (userRole === 'student' && reason.includes("ended")) {
                followupBanner.classList.remove('hidden');
            }
        }

        async function join() {
            const response = await fetch('/api/appointments/chat/join', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ appointment_id: appointmentId })
            });
            const data = await response.json();
            
            if (!response.ok) {
                lockChat(data.detail || data.message || 'Unable to join real-time chat.');
                return false;
            }
            statusEl.textContent = '● Real-time Session Live';
            statusEl.className = "text-sm font-bold text-teal-600 animate-pulse";
            isSessionActive = true;
            return true;
        }

        async function loadMessages() {
            const response = await fetch('/api/appointments/chat/messages/list', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ appointment_id: appointmentId })
            });
            const data = await response.json();
            if (!response.ok) return;
            renderMessages(data.messages || []);
        }

        async function sendMessage() {
            if (!isSessionActive) return;
            const body = bodyEl.value.trim();
            if (!body) return;
            
            bodyEl.value = '';
            
            const response = await fetch('/api/appointments/chat/messages/send', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ appointment_id: appointmentId, body })
            });
            
            const data = await response.json();
            if (!response.ok) {
                lockChat(data.detail || 'Message rejected by server constraints.');
            }
            await loadMessages();
        }

        bodyEl.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') sendMessage();
        });

        (async function init() {
            await fetchRole();
            
            await loadMessages();
            
            await join();
            
            setInterval(async () => {
                await loadMessages();
            }, 3000);
        })();
    </script>
</body>
</html>
