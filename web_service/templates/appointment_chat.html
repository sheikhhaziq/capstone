<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindBridge — Clinical Session</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/theme.css">
    <script src="/static/js/theme.js"></script>
    <style>
        .msg-student {
            background: var(--gradient-indigo);
            color: white;
            border-bottom-right-radius: 4px;
        }
        .msg-psychologist {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-bottom-left-radius: 4px;
        }
        [data-theme="light"] .msg-psychologist {
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(0, 0, 0, 0.05);
        }
    </style>
</head>
<body class="h-screen overflow-hidden">
    <button id="theme-toggle" class="theme-toggle" title="Toggle Theme">
        <span id="theme-toggle-icon">☀️</span>
    </button>

    <div class="max-w-4xl mx-auto flex flex-col h-full relative z-10">
        <header class="p-6 flex items-center justify-between border-b border-white/10">
            <div>
                <h1 class="text-2xl font-black gradient-text tracking-tight uppercase">Clinical Session</h1>
                <div class="flex items-center gap-2 mt-1">
                    <span id="session-dot" class="w-2 h-2 rounded-full bg-muted"></span>
                    <p id="status" class="text-[10px] font-black uppercase tracking-widest text-muted">Awaiting connection...</p>
                </div>
            </div>
            <a href="javascript:history.back()" class="px-5 py-2 glass-card rounded-xl text-xs font-bold hover:bg-rose-500/10 hover:text-rose-500 transition-all">
                End Session
            </a>
        </header>
        
        <div id="followup-banner" class="hidden m-4 p-6 glass-card border-accent-indigo/30 bg-accent-indigo/5 animate-in slide-in-from-top duration-500">
            <div class="flex flex-col md:flex-row items-center justify-between gap-6">
                <div>
                    <h3 class="font-bold text-lg mb-1">Session Concluded</h3>
                    <p class="text-sm text-secondary">Your transcript is securely stored. You can book a follow-up session to continue your care.</p>
                </div>
                <a href="/student/dashboard" class="btn-premium px-8 py-3 whitespace-nowrap">Book Follow-up</a>
            </div>
        </div>

        <main id="messages" class="flex-1 p-6 overflow-y-auto space-y-6 scroll-smooth scrollbar-hide">
            <div class="flex flex-col items-center justify-center h-full opacity-20">
                <svg class="w-20 h-20 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
                <p class="font-bold uppercase tracking-[0.3em] text-xs">MindBridge encrypted line</p>
            </div>
        </main>

        <footer id="input-container" class="p-6 transition-all">
            <div class="relative max-w-4xl mx-auto group">
                <div class="absolute -inset-1 bg-gradient-to-r from-accent-indigo to-accent-teal rounded-2xl blur opacity-0 group-focus-within:opacity-20 transition duration-1000"></div>
                <div class="relative flex gap-3 glass-card p-2 rounded-2xl border-white/10">
                    <input id="body" type="text" placeholder="Type your message securely..."
                        class="flex-1 bg-transparent px-6 py-4 text-sm focus:outline-none placeholder:text-muted">
                    <button id="send-btn" onclick="sendMessage()" class="btn-premium px-8 rounded-xl text-sm">Send</button>
                </div>
            </div>
            <p class="text-[9px] text-center text-muted mt-4 uppercase tracking-widest font-bold">Encrypted End-to-End • HIPAA Compliant Environment</p>
        </footer>
    </div>

    <script>
        const appointmentId = Number('{{ appointment_id }}');
        const statusEl = document.getElementById('status');
        const dotEl = document.getElementById('session-dot');
        const messagesEl = document.getElementById('messages');
        const bodyEl = document.getElementById('body');
        const sendBtn = document.getElementById('send-btn');
        const inputContainer = document.getElementById('input-container');
        const followupBanner = document.getElementById('followup-banner');

        let userRole = null;
        let isSessionActive = true;
        let lastMessageCount = 0;

        function formatTime(iso) {
            return new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        async function fetchRole() {
            const res = await fetch('/api/session');
            if (res.ok) {
                const data = await res.json();
                userRole = data.user.role;
            }
        }

        function renderMessages(items) {
            if (items.length === lastMessageCount && lastMessageCount !== 0) return;
            lastMessageCount = items.length;

            messagesEl.innerHTML = '';
            if (!items.length) {
                messagesEl.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-full space-y-4 animate-in fade-in duration-1000">
                        <div class="p-10 glass-card text-center max-w-sm border-dashed">
                             <p class="text-secondary font-medium italic">"Every journey starts with a single word."</p>
                             <p class="text-[10px] uppercase font-black tracking-widest text-muted mt-4">Secure transcript started</p>
                        </div>
                    </div>
                `;
                return;
            }
            
            items.forEach(msg => {
                const isMine = (userRole === msg.sender_role);
                const row = document.createElement('div');
                row.className = `flex flex-col ${isMine ? 'items-end' : 'items-start'} animate-in fade-in slide-in-from-${isMine ? 'right' : 'left'}-4 duration-300`;
                
                const bubbleClass = (msg.sender_role === 'student' ? 'msg-student shadow-indigo-500/20' : 'msg-psychologist shadow-xl');
                
                row.innerHTML = `
                    <div class="flex items-center gap-2 mb-1 px-2">
                        <span class="text-[9px] font-black uppercase tracking-widest text-muted">${msg.sender_role}</span>
                        <span class="text-[9px] text-muted opacity-50">•</span>
                        <span class="text-[9px] text-muted font-bold">${formatTime(msg.sent_at)}</span>
                    </div>
                    <div class="px-5 py-3 rounded-2xl text-sm ${bubbleClass} shadow-lg max-w-[85%] leading-relaxed">
                        ${msg.body}
                    </div>
                `;
                messagesEl.appendChild(row);
            });
            setTimeout(() => { 
                messagesEl.scrollTo({ top: messagesEl.scrollHeight, behavior: 'smooth' });
            }, 50);
        }

        function lockChat(reason) {
            isSessionActive = false;
            statusEl.textContent = reason;
            statusEl.classList.add('text-rose-500');
            dotEl.className = "w-2 h-2 rounded-full bg-rose-500";
            
            bodyEl.disabled = true;
            sendBtn.disabled = true;
            inputContainer.classList.add('opacity-50', 'grayscale');
            
            if (userRole === 'student' && reason.toLowerCase().includes("ended")) {
                followupBanner.classList.remove('hidden');
            }
        }

        async function join() {
            const response = await fetch('/api/appointments/chat/join', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ appointment_id: appointmentId })
            });
            const data = await response.json();
            
            if (!response.ok) {
                lockChat(data.detail || data.message || 'Access Restricted');
                return false;
            }
            statusEl.textContent = 'Session Live';
            dotEl.className = "w-2 h-2 rounded-full bg-emerald-500 animate-pulse shadow-lg shadow-emerald-500/50";
            isSessionActive = true;
            return true;
        }

        async function loadMessages() {
            const response = await fetch('/api/appointments/chat/messages/list', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ appointment_id: appointmentId })
            });
            const data = await response.json();
            if (!response.ok) return;
            renderMessages(data.messages || []);
        }

        async function sendMessage() {
            if (!isSessionActive) return;
            const body = bodyEl.value.trim();
            if (!body) return;
            
            bodyEl.value = '';
            
            const response = await fetch('/api/appointments/chat/messages/send', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ appointment_id: appointmentId, body })
            });
            
            const data = await response.json();
            if (!response.ok) {
                lockChat(data.detail || 'Message Transmission Interrupted.');
            }
            await loadMessages();
        }

        bodyEl.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') sendMessage();
        });

        (async function init() {
            await fetchRole();
            await loadMessages();
            await join();
            setInterval(loadMessages, 3000);
        })();
    </script>
</body>
</html>
