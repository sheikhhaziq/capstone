<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appointment Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen">
    <div class="max-w-4xl mx-auto p-4">
        <div class="flex items-center justify-between mb-3">
            <h1 class="text-xl font-semibold text-slate-800">Appointment Chat</h1>
            <a href="javascript:history.back()" class="text-sm text-teal-700 hover:underline">Back</a>
        </div>
        <p id="status" class="text-sm text-slate-600 mb-3"></p>
        <div id="messages" class="bg-white rounded-xl border border-slate-200 p-4 h-[60vh] overflow-y-auto space-y-2"></div>
        <div class="mt-3 flex gap-2">
            <input id="body" type="text" placeholder="Type a message..."
                class="flex-1 bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500">
            <button onclick="sendMessage()" class="px-4 py-2 bg-teal-600 text-white rounded-lg text-sm">Send</button>
        </div>
    </div>

    <script>
        const appointmentId = Number('{{ appointment_id }}');
        const statusEl = document.getElementById('status');
        const messagesEl = document.getElementById('messages');
        const bodyEl = document.getElementById('body');

        function renderMessages(items) {
            messagesEl.innerHTML = '';
            if (!items.length) {
                messagesEl.innerHTML = '<p class="text-sm text-slate-500">No messages yet.</p>';
                return;
            }
            items.forEach(msg => {
                const row = document.createElement('div');
                row.className = 'border border-slate-200 rounded p-2';
                row.innerHTML = `
                    <p class="text-xs text-slate-500">${msg.sender_role} (${msg.sender_id}) • ${new Date(msg.sent_at).toLocaleString()}</p>
                    <p class="text-sm text-slate-800">${msg.body}</p>
                `;
                messagesEl.appendChild(row);
            });
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        async function join() {
            const response = await fetch('/api/appointments/chat/join', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ appointment_id: appointmentId })
            });
            const data = await response.json();
            if (!response.ok) {
                statusEl.textContent = data.detail || data.message || 'Unable to join chat.';
                return false;
            }
            statusEl.textContent = `Joined session ${data.session_id} for appointment ${appointmentId}`;
            return true;
        }

        async function loadMessages() {
            const response = await fetch('/api/appointments/chat/messages/list', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ appointment_id: appointmentId })
            });
            const data = await response.json();
            if (!response.ok) {
                statusEl.textContent = data.detail || data.message || 'Unable to load messages.';
                return;
            }
            renderMessages(data.messages || []);
        }

        async function sendMessage() {
            const body = bodyEl.value.trim();
            if (!body) return;
            const response = await fetch('/api/appointments/chat/messages/send', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ appointment_id: appointmentId, body })
            });
            const data = await response.json();
            if (!response.ok) {
                statusEl.textContent = data.detail || data.message || 'Unable to send message.';
                return;
            }
            bodyEl.value = '';
            await loadMessages();
        }

        (async function init() {
            const ok = await join();
            if (!ok) return;
            await loadMessages();
            setInterval(loadMessages, 4000);
        })();
    </script>
</body>
</html>
