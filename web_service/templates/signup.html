<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindSpace Signup</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
        <h1 class="text-2xl font-bold text-slate-800">Create Student Account</h1>
        <p class="text-sm text-slate-500 mt-1">Sign up to start using MindSpace.</p>
        <div class="mt-5 space-y-3">
            <input id="student-id" type="text" placeholder="Student ID"
                class="w-full bg-slate-100 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500">
            <input id="name" type="text" placeholder="Full Name"
                class="w-full bg-slate-100 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500">
            <input id="password" type="password" placeholder="Password"
                class="w-full bg-slate-100 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500">
            <button onclick="signup()"
                class="w-full bg-teal-600 hover:bg-teal-700 text-white rounded-xl py-3 text-sm font-medium">Sign Up</button>
        </div>
        <p id="message" class="text-sm mt-3"></p>
        <p class="text-sm text-slate-600 mt-4">Already have an account?
            <a href="/login" class="text-teal-700 font-semibold hover:underline">Login</a>
        </p>
    </div>

    <script>
        async function signup() {
            const student_id = document.getElementById('student-id').value.trim();
            const name = document.getElementById('name').value.trim();
            const password = document.getElementById('password').value.trim();
            const message = document.getElementById('message');
            message.textContent = '';
            message.className = 'text-sm mt-3';

            if (!student_id || !name || !password) {
                message.classList.add('text-red-600');
                message.textContent = 'Please fill all fields.';
                return;
            }

            try {
                const response = await fetch('/api/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ student_id, name, password })
                });
                const data = await response.json();
                if (response.status === 201) {
                    message.classList.add('text-green-700');
                    message.textContent = 'Signup successful. Redirecting to login...';
                    setTimeout(() => { window.location.href = '/login'; }, 900);
                    return;
                }
                message.classList.add('text-red-600');
                message.textContent = data.message || 'Signup failed.';
            } catch (error) {
                message.classList.add('text-red-600');
                message.textContent = 'Unable to connect to server.';
            }
        }
    </script>
</body>
</html>
