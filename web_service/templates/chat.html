<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindSpace Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.9/dist/purify.min.js"></script>
</head>
<body class="bg-slate-50 h-screen flex flex-col font-sans text-slate-800">
    <header class="bg-white shadow-sm p-4 flex items-center justify-between z-10">
        <div class="flex items-center gap-3">
            <div class="bg-teal-100 p-2 rounded-full">
                <i class="fa-solid fa-leaf text-teal-600 text-xl"></i>
            </div>
            <div>
                <h1 class="font-bold text-xl text-slate-800">MindSpace</h1>
                <p class="text-xs text-slate-500">AI Student Support</p>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <button onclick="clearChatHistory()" class="text-sm text-slate-400 hover:text-red-500 transition" title="Clear Chat History">
                <i class="fa-solid fa-trash-can mr-1"></i> Clear History
            </button>
            <span id="auth-status" class="text-xs text-slate-500"></span>
            <button onclick="logout()" class="text-sm text-slate-400 hover:text-red-500 transition">
                <i class="fa-solid fa-right-from-bracket mr-1"></i> Logout
            </button>
        </div>
    </header>

    <main id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-4">
        <div class="flex justify-start">
            <div class="bg-white border border-slate-100 rounded-2xl rounded-tl-none p-4 shadow-sm max-w-[85%] md:max-w-[70%]">
                <p class="text-sm leading-relaxed">Hello! I am here to listen without judgment. How are you feeling today?</p>
            </div>
        </div>
    </main>

    <footer class="bg-white p-4 border-t border-slate-100">
        <div class="max-w-4xl mx-auto relative flex items-center gap-2">
            <input type="text" id="user-input"
                class="w-full bg-slate-100 rounded-full pl-6 pr-12 py-4 focus:outline-none focus:ring-2 focus:ring-teal-500 transition shadow-inner text-sm"
                placeholder="Type how you feel..." onkeypress="if(event.key==='Enter') sendMessage()">
            <button onclick="sendMessage()"
                class="absolute right-2 bg-teal-600 hover:bg-teal-700 text-white p-3 rounded-full shadow-md transition">
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </div>
    </footer>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const authStatus = document.getElementById('auth-status');

        async function requireSession() {
            const response = await fetch('/api/session');
            if (!response.ok) {
                window.location.href = '/login';
                return;
            }
            const data = await response.json();
            authStatus.textContent = `Logged in as ${data.user.student_id || 'student'}`;
        }

        async function loadPreviousConversation() {
            const response = await fetch('/api/chat/history');
            if (!response.ok) return;
            const data = await response.json();
            const transcript = data.transcript || [];
            if (!Array.isArray(transcript) || transcript.length === 0) return;
            chatContainer.innerHTML = '';
            transcript.forEach(msg => addMessage(msg.text || '', msg.role === 'user'));
        }

        function addMessage(text, isUser) {
            const div = document.createElement('div');
            div.className = `flex ${isUser ? 'justify-end' : 'justify-start'}`;
            const bubble = document.createElement('div');
            bubble.className = isUser
                ? 'bg-teal-600 text-white rounded-2xl rounded-tr-none p-4 shadow-md max-w-[85%] md:max-w-[70%] text-sm'
                : 'bg-white border border-slate-100 rounded-2xl rounded-tl-none p-4 shadow-sm max-w-[85%] md:max-w-[70%] text-sm leading-relaxed prose';
            if (isUser) {
                bubble.textContent = text;
            } else {
                bubble.innerHTML = DOMPurify.sanitize(marked.parse(text));
            }
            div.appendChild(bubble);
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;
            addMessage(text, true);
            userInput.value = '';

            // Add placeholder for assistant response
            const responseDiv = document.createElement('div');
            responseDiv.className = 'flex justify-start';
            const bubble = document.createElement('div');
            bubble.className = 'bg-white border border-slate-100 rounded-2xl rounded-tl-none p-4 shadow-sm max-w-[85%] md:max-w-[70%] text-sm leading-relaxed prose';
            bubble.innerHTML = '<span class="animate-pulse">...</span>';
            responseDiv.appendChild(bubble);
            chatContainer.appendChild(responseDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text, history_ids: [] })
                });

                if (response.status === 401) {
                    window.location.href = '/login';
                    return;
                }

                if (!response.ok) {
                    bubble.textContent = 'I am having trouble right now.';
                    return;
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let fullText = "";
                bubble.innerHTML = ""; // Clear the pulse

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    
                    const chunk = decoder.decode(value, { stream: true });
                    const lines = chunk.split('\n');
                    
                    for (const line of lines) {
                        if (!line.trim()) continue;
                        try {
                            const data = JSON.parse(line);
                            if (data.text) {
                                fullText += data.text;
                                // Sanitize and parse markdown
                                bubble.innerHTML = DOMPurify.sanitize(marked.parse(fullText));
                                chatContainer.scrollTop = chatContainer.scrollHeight;
                            }
                            if (data.response) { // Crisis alert block
                                fullText = data.response;
                                bubble.innerHTML = DOMPurify.sanitize(marked.parse(fullText));
                                chatContainer.scrollTop = chatContainer.scrollHeight;
                            }
                        } catch (e) {
                            console.error("Error parsing chunk", e);
                        }
                    }
                }
            } catch (error) {
                bubble.textContent = 'Server connection error.';
            }
        }

        async function logout() {
            await fetch('/api/logout', { method: 'POST' });
            window.location.href = '/login';
        }

        async function clearChatHistory() {
            if (!confirm('Are you sure you want to delete your entire chat history? This cannot be undone.')) return;
            
            try {
                const response = await fetch('/api/chat/reset', { method: 'POST' });
                if (response.ok) {
                    chatContainer.innerHTML = `
                        <div class="flex justify-start">
                            <div class="bg-white border border-slate-100 rounded-2xl rounded-tl-none p-4 shadow-sm max-w-[85%] md:max-w-[70%]">
                                <p class="text-sm leading-relaxed">History cleared. How can I help you today?</p>
                            </div>
                        </div>
                    `;
                } else {
                    alert('Failed to clear history.');
                }
            } catch (error) {
                alert('Connection error.');
            }
        }

        (async function init() {
            await requireSession();
            await loadPreviousConversation();
        })();
    </script>
</body>
</html>
