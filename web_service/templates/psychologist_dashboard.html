<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Psychologist Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen p-6">
    <div class="max-w-5xl mx-auto">
        <div class="flex items-center justify-between mb-6">
            <h1 class="text-2xl font-bold text-slate-800">Psychologist Dashboard</h1>
            <button onclick="logout()" class="text-sm text-red-600 hover:underline">Logout</button>
        </div>
        <p id="session-text" class="text-sm text-slate-600 mb-4"></p>
        <div class="grid lg:grid-cols-3 gap-6">
            <section class="bg-white rounded-xl border border-slate-200 p-5 shadow-sm h-fit">
                <h2 class="font-bold text-slate-800 mb-4 tracking-tight">Add Availability Slot</h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Start Time</label>
                        <input id="start_at" type="datetime-local" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-3 text-sm focus:ring-2 focus:ring-teal-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">End Time</label>
                        <input id="end_at" type="datetime-local" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-3 text-sm focus:ring-2 focus:ring-teal-500 outline-none">
                    </div>
                    <button id="add-slot-btn" onclick="addSlot()" class="w-full pt-2 px-4 py-3 bg-teal-600 text-white font-semibold rounded-xl shadow-sm hover:bg-teal-700 hover:shadow transition-all focus:outline-none">Create Slot</button>
                </div>
            </section>

            <section class="bg-white rounded-xl border border-slate-200 p-5 shadow-sm">
                <h2 class="font-bold text-slate-800 mb-4 tracking-tight">Upcoming Open Slots</h2>
                <div id="slot-list" class="space-y-3 text-sm"></div>
            </section>

            <section class="bg-white rounded-xl border border-slate-200 p-5 shadow-sm">
                <h2 class="font-bold text-slate-800 mb-4 tracking-tight">Booked Appointments</h2>
                <div id="appointment-list" class="space-y-3 text-sm"></div>
            </section>
        </div>
    </div>

    <script>
        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `fixed bottom-4 right-4 px-6 py-3 rounded-xl shadow-xl text-white font-medium transform transition-all translate-y-full opacity-0 z-50 ${type === 'success' ? 'bg-teal-600' : 'bg-rose-600'}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            
            setTimeout(() => { toast.classList.remove('translate-y-full', 'opacity-0'); }, 10);
            setTimeout(() => {
                toast.classList.add('translate-y-full', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function formatTime(iso) {
            const d = new Date(iso);
            return d.toLocaleString('en-US', { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit', hour12: true });
        }

        function toIso(value) {
            return new Date(value).toISOString();
        }

        async function requirePsychologistSession() {
            const response = await fetch('/api/session');
            if (!response.ok) {
                window.location.href = '/psychologist/login';
                return null;
            }
            const data = await response.json();
            if (data.user.role !== 'psychologist') {
                window.location.href = '/psychologist/login';
                return null;
            }
            document.getElementById('session-text').textContent = `Welcome back, ${data.user.name}`;
            return data.user;
        }

        async function addSlot() {
            const startRaw = document.getElementById('start_at').value;
            const endRaw = document.getElementById('end_at').value;
            const btn = document.getElementById('add-slot-btn');
            
            if (!startRaw || !endRaw) {
                showToast('Please provide start and end date-time.', 'error');
                return;
            }
            
            const originalText = btn.textContent;
            btn.textContent = 'Creating...';
            btn.disabled = true;
            btn.classList.add('opacity-70');

            const response = await fetch('/api/psychologist/slots', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ start_at: toIso(startRaw), end_at: toIso(endRaw) })
            });
            const data = await response.json();
            
            btn.textContent = originalText;
            btn.disabled = false;
            btn.classList.remove('opacity-70');

            if (response.ok) {
                showToast('Slot securely added.', 'success');
                document.getElementById('start_at').value = '';
                document.getElementById('end_at').value = '';
                await loadOpenSlots();
            } else {
                showToast(data.detail || data.message || 'Could not create slot.', 'error');
            }
        }

        async function loadOpenSlots() {
            const list = document.getElementById('slot-list');
            list.innerHTML = '<div class="text-slate-400 italic py-4">Loading open slots...</div>';
            
            const response = await fetch('/api/psychologist/slots');
            const data = await response.json();
            
            if (!response.ok || data.status !== 'OK') {
                list.innerHTML = '<div class="text-rose-500 py-4">Could not load open slots.</div>';
                return;
            }
            if (data.slots.length === 0) {
                list.innerHTML = '<div class="p-6 text-center border border-dashed rounded-xl border-slate-300 text-slate-500">No open slots available.</div>';
                return;
            }
            
            list.innerHTML = '';
            data.slots.forEach(slot => {
                const row = document.createElement('div');
                row.className = 'border border-slate-200 bg-slate-50 rounded-xl p-4 transition-all hover:bg-white';
                row.innerHTML = `
                    <p class="text-slate-800 font-medium">${formatTime(slot.start_at)}</p>
                    <p class="text-slate-500 text-xs mt-1">until ${formatTime(slot.end_at)}</p>
                `;
                list.appendChild(row);
            });
        }

        async function loadAppointments() {
            const list = document.getElementById('appointment-list');
            list.innerHTML = '<div class="text-slate-400 italic py-4">Loading appointments...</div>';
            
            const response = await fetch('/api/psychologist/appointments');
            const data = await response.json();
            
            if (!response.ok || data.status !== 'OK') {
                list.innerHTML = '<div class="text-rose-500 py-4">Could not load appointments.</div>';
                return;
            }
            if (data.appointments.length === 0) {
                list.innerHTML = '<div class="p-6 text-center border border-dashed rounded-xl border-slate-300 text-slate-500">No appointments scheduled.</div>';
                return;
            }
            
            list.innerHTML = '';
            data.appointments.forEach(item => {
                const row = document.createElement('div');
                row.className = 'border border-slate-200 rounded-xl p-4 bg-teal-50/30';
                row.innerHTML = `
                    <div class="flex justify-between items-start mb-2">
                        <p class="font-bold text-slate-800">${item.student_name} <span class="font-normal text-slate-500 text-xs">#${item.student_id}</span></p>
                        <span class="px-2 py-0.5 text-[10px] uppercase font-bold tracking-wider rounded-full bg-teal-100 text-teal-800">${item.status}</span>
                    </div>
                    <p class="text-slate-600 font-medium">${formatTime(item.start_at)}</p>
                    <a class="mt-4 block text-center w-full px-4 py-2.5 bg-slate-800 text-white font-medium rounded-lg hover:bg-slate-900 transition" href="/appointments/chat/${item.appointment_id}">Host Session</a>
                `;
                list.appendChild(row);
            });
        }

        async function logout() {
            await fetch('/api/logout', { method: 'POST' });
            window.location.href = '/psychologist/login';
        }

        (async function init() {
            const session = await requirePsychologistSession();
            if (!session) return;
            await loadOpenSlots();
            await loadAppointments();
        })();
    </script>
</body>
</html>
