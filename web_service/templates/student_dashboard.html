<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen p-6">
    <div class="max-w-6xl mx-auto">
        <div class="flex items-center justify-between mb-6">
            <h1 class="text-2xl font-bold text-slate-800">Student Dashboard</h1>
            <div class="space-x-3 flex items-center">
                <a href="/chat" class="text-sm text-teal-700 hover:underline">AI Chat</a>
                <button onclick="clearAiHistory()" class="text-sm text-slate-500 hover:text-red-500 transition border-l border-slate-300 pl-3">Clear AI History</button>
                <a href="{{ forum_url }}/forum" target="_blank" rel="noopener noreferrer" class="text-sm text-teal-700 hover:underline">Peer Forum</a>
                <a href="/screening" class="text-sm text-teal-700 hover:underline">Take Screening</a>
                <a href="/resources" class="text-sm text-teal-700 hover:underline">Resource Hub</a>
                <button onclick="logout()" class="text-sm text-red-600 hover:underline">Logout</button>
            </div>
        </div>
        <p id="session-text" class="text-sm text-slate-600 mb-4"></p>

        <div class="grid md:grid-cols-2 gap-6">
            <section class="bg-white rounded-xl border border-slate-200 p-4">
                <h2 class="font-semibold text-slate-800 mb-3">Available Slots</h2>
                <div id="slot-list" class="space-y-2 text-sm text-slate-700"></div>
            </section>

            <section class="bg-white rounded-xl border border-slate-200 p-4">
                <h2 class="font-semibold text-slate-800 mb-3">My Appointments</h2>
                <div id="appointment-list" class="space-y-2 text-sm text-slate-700"></div>
            </section>
        </div>
    </div>

    <script>
        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `fixed bottom-4 right-4 px-6 py-3 rounded-lg shadow-lg text-white font-medium transform transition-all translate-y-full opacity-0 z-50 ${type === 'success' ? 'bg-teal-600' : 'bg-red-600'}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.classList.remove('translate-y-full', 'opacity-0');
            }, 10);
            
            setTimeout(() => {
                toast.classList.add('translate-y-full', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        async function requireStudentSession() {
            const response = await fetch('/api/session');
            if (!response.ok) {
                window.location.href = '/login';
                return null;
            }
            const data = await response.json();
            if (data.user.role !== 'student') {
                window.location.href = '/login';
                return null;
            }
            document.getElementById('session-text').textContent = `Logged in as ${data.user.name} (${data.user.subject})`;
            return data.user;
        }

        function formatTime(iso) {
            const d = new Date(iso);
            return d.toLocaleString('en-US', {
                weekday: 'short', month: 'short', day: 'numeric',
                hour: 'numeric', minute: '2-digit', hour12: true
            });
        }

        async function loadSlots() {
            const slotList = document.getElementById('slot-list');
            slotList.innerHTML = '<div class="text-slate-400 italic py-4">Loading open slots...</div>';
            
            const response = await fetch('/api/student/slots');
            const data = await response.json();
            
            if (!response.ok || data.status !== 'OK') {
                slotList.innerHTML = '<div class="text-red-500 py-4">Could not load availability slots.</div>';
                return;
            }
            if (data.slots.length === 0) {
                slotList.innerHTML = '<div class="p-6 text-center border border-dashed rounded-lg border-slate-300 text-slate-500">No open slots available right now.</div>';
                return;
            }
            
            slotList.innerHTML = '';
            data.slots.forEach(slot => {
                const row = document.createElement('div');
                row.className = 'border border-slate-200 rounded-xl p-4 flex flex-col justify-between hover:shadow-sm transition-shadow';
                row.innerHTML = `
                    <div>
                        <p class="font-bold text-slate-800 text-base">${slot.psychologist_name}</p>
                        <p class="text-teal-700 text-xs font-medium uppercase mb-2">${slot.specialization}</p>
                        <p class="text-slate-600 font-medium">${formatTime(slot.start_at)}</p>
                        <p class="text-slate-400 text-sm opacity-80">until ${formatTime(slot.end_at)}</p>
                    </div>
                    <button class="mt-4 w-full px-4 py-2.5 bg-teal-600 text-white font-medium rounded-lg hover:bg-teal-700 transition focus:outline-none focus:ring-2 focus:ring-teal-500 focus:ring-offset-1">Book Appointment</button>
                `;
                
                const btn = row.querySelector('button');
                btn.onclick = async () => {
                    const originalText = btn.textContent;
                    btn.textContent = 'Booking...';
                    btn.disabled = true;
                    btn.classList.add('opacity-70', 'cursor-not-allowed');

                    const bookResp = await fetch('/api/student/appointments/book', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ slot_id: slot.slot_id })
                    });
                    
                    const bookData = await bookResp.json();
                    if (bookResp.ok) {
                        showToast('Appointment easily booked!', 'success');
                        await loadSlots();
                        await loadAppointments();
                    } else {
                        showToast(bookData.message || bookData.detail || 'Failed to book slot.', 'error');
                        btn.textContent = originalText;
                        btn.disabled = false;
                        btn.classList.remove('opacity-70', 'cursor-not-allowed');
                        await loadSlots();
                    }
                };
                slotList.appendChild(row);
            });
        }

        async function loadAppointments() {
            const list = document.getElementById('appointment-list');
            list.innerHTML = '<div class="text-slate-400 italic py-4">Loading your appointments...</div>';
            
            const response = await fetch('/api/student/appointments');
            const data = await response.json();
            
            if (!response.ok || data.status !== 'OK') {
                list.innerHTML = '<div class="text-red-500 py-4">Could not load your appointments.</div>';
                return;
            }
            if (data.appointments.length === 0) {
                list.innerHTML = '<div class="p-6 text-center border border-dashed rounded-lg border-slate-300 text-slate-500">You have no upcoming appointments.</div>';
                return;
            }
            
            list.innerHTML = '';
            data.appointments.forEach(item => {
                const row = document.createElement('div');
                row.className = 'border border-slate-200 bg-slate-50 rounded-xl p-4 flex flex-col justify-between';
                row.innerHTML = `
                    <div class="flex justify-between items-start mb-2">
                        <p class="font-bold text-slate-800">${item.psychologist_name}</p>
                        <span class="px-2 py-1 text-[10px] uppercase font-bold tracking-wider rounded-full ${
                            item.status === 'booked' ? 'bg-amber-100 text-amber-800' : 'bg-slate-200 text-slate-700'
                        }">${item.status}</span>
                    </div>
                    <p class="text-slate-600 font-medium">${formatTime(item.start_at)}</p>
                    <a class="mt-4 block text-center w-full px-4 py-2.5 bg-slate-800 text-white font-medium rounded-lg hover:bg-slate-900 transition" href="/appointments/chat/${item.appointment_id}">Join Room</a>
                `;
                list.appendChild(row);
            });
        }

        async function logout() {
            await fetch('/api/logout', { method: 'POST' });
            window.location.href = '/login';
        }

        async function clearAiHistory() {
            if (!confirm('Are you sure you want to delete your entire AI chat history? This cannot be undone.')) return;
            
            try {
                const response = await fetch('/api/chat/reset', { method: 'POST' });
                if (response.ok) {
                    showToast('AI Chat history cleared successfully!', 'success');
                } else {
                    showToast('Failed to clear history.', 'error');
                }
            } catch (error) {
                showToast('Connection error.', 'error');
            }
        }

        (async function init() {
            const session = await requireStudentSession();
            if (!session) return;
            await loadSlots();
            await loadAppointments();
        })();
    </script>
</body>
</html>
