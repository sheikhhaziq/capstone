<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Psychoeducational Resources - MindBridge</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen p-6">
    <div class="max-w-6xl mx-auto">
        <div class="flex items-center justify-between mb-6">
            <h1 class="text-3xl font-bold text-slate-800 tracking-tight">Resource Hub</h1>
            <a href="/student/dashboard" class="px-4 py-2 bg-white text-teal-700 font-medium border border-teal-200 rounded-lg shadow-sm hover:bg-teal-50 transition">Back to Dashboard</a>
        </div>
        
        <p class="text-slate-600 mb-8 max-w-2xl text-lg">Explore curated mental wellness resources. Below are videos, guides, and audio materials to help you build coping strategies, mindfulness, and resilience.</p>
        
        <div id="resources-grid" class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="col-span-full">
                <p class="text-slate-500 italic text-center py-10">Loading resources...</p>
            </div>
        </div>
    </div>

    <script>
        async function loadResources() {
            const grid = document.getElementById('resources-grid');
            const resp = await fetch('/api/student/resources');
            const data = await resp.json();

            if (!resp.ok) {
                grid.innerHTML = '<div class="col-span-full text-center"><p class="text-red-500 py-10">Failed to load resources.</p></div>';
                return;
            }

            if (data.resources.length === 0) {
                grid.innerHTML = '<div class="col-span-full text-center"><p class="text-slate-500 py-10">No resources available at the moment. Please check back later.</p></div>';
                return;
            }

            grid.innerHTML = '';
            data.resources.forEach(r => {
                const card = document.createElement('div');
                card.className = 'bg-white rounded-2xl shadow-sm border border-slate-200 p-5 flex flex-col hover:shadow-md transition-shadow relative overflow-hidden group';
                let mediaHtml = '';
                
                // Beautiful type indicator badge
                let typeColor = 'bg-blue-100 text-blue-800';
                if (r.resource_type.toLowerCase() === 'video') typeColor = 'bg-rose-100 text-rose-800';
                if (r.resource_type.toLowerCase() === 'audio') typeColor = 'bg-emerald-100 text-emerald-800';
                if (r.resource_type.toLowerCase() === 'guide') typeColor = 'bg-indigo-100 text-indigo-800';

                // Display youtube embed if applicable
                if (r.resource_type.toLowerCase() === 'video' && r.url.includes('youtube.com/embed')) {
                     mediaHtml = `<div class="mb-5 aspect-video overflow-hidden rounded-xl bg-slate-100 flex-shrink-0"><iframe class="w-full h-full" src="${r.url}" frameborder="0" allowfullscreen></iframe></div>`;
                }

                card.innerHTML = `
                    ${mediaHtml}
                    <div class="flex items-start justify-between mb-3">
                        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold uppercase tracking-wider ${typeColor}">
                            ${r.resource_type}
                        </span>
                    </div>
                    <h3 class="font-bold text-xl text-slate-800 mb-2 group-hover:text-teal-700 transition-colors">${r.title}</h3>
                    <p class="text-slate-600 mb-6 flex-grow leading-relaxed">${r.description || ''}</p>
                    <a href="${r.url}" target="_blank" class="block text-center w-full px-5 py-2.5 bg-slate-800 hover:bg-slate-900 text-white rounded-lg font-medium transition-colors">
                        View Resource
                    </a>
                `;
                grid.appendChild(card);
            });
        }
        
        loadResources();
    </script>
</body>
</html>
